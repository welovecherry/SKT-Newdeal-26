# 2과목 실습 문서의 명령 · 파이썬을 Windows 에서 실측한다 (win-check 브랜치에서만 돈다)
name: win-check
on:
  push:
    branches: [win-check]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Git Bash commands"
        shell: bash
        continue-on-error: true
        run: bash wincheck/bash_cmds.sh
      - name: "PowerShell 5.1 commands"
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          ./wincheck/ps_cmds.ps1
