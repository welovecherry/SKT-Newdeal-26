# 2과목 실습 문서의 명령 · 파이썬을 Windows 에서 실측한다 (win-check 브랜치에서만 돈다)
name: win-check
on:
  push:
    branches: [win-check]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Git Bash commands"
        shell: bash
        continue-on-error: true
        run: bash wincheck/bash_cmds.sh
      - name: "PowerShell 5.1 commands"
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          ./wincheck/ps_cmds.ps1
      - name: "Python answers (Git Bash)"
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          cd wincheck
          for f in *.py; do echo "### $f"; python "$f" || echo "!!FAILED $f"; done
      - name: "DGA files in student order (PowerShell)"
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          cd wincheck/dga
          foreach ($f in "label.py","features.py","typosquat.py","nx_count.py","long_label.py") { "### $f"; python $f }
          Copy-Item score_v1.py dga_score.py; "### dga_score v1"; python dga_score.py; python judge.py; python evaluate.py
          Copy-Item score_v2.py dga_score.py -Force; "### dga_score v2 (6-5)"; python evaluate.py; python threshold.py; python report_table3.py
